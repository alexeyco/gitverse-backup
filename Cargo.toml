[package]
name = "gitverse-backup"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.9"
ctrlc = { version = "3", features = ["termination"] }
cron = "0.15"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
figment = { version = "0.10", features = ["env", "test"] }
mockall = "0.15"
tiny_http = "0.12"

[[test]]
name = "e2e_archive_restore"
path = "tests/e2e_archive_restore.rs"
harness = false
